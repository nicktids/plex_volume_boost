<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px;
      font: 13px system-ui, sans-serif;
      background: #1f1f1f;
      color: #eee;
    }
    h1 { font-size: 14px; margin: 0 0 10px; color: #e5a00d; }
    .value { font-size: 28px; font-weight: 600; text-align: center; margin: 4px 0 8px; }
    input[type=range] { width: 100%; accent-color: #e5a00d; }
    .ticks { display: flex; justify-content: space-between; font-size: 11px; color: #999; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 7px;
      border: 0;
      border-radius: 4px;
      background: #3a3a3a;
      color: #eee;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #4a4a4a; }
  </style>
</head>
<body>
  <h1>Plex Volume Boost</h1>
  <div class="value" id="value">100%</div>
  <input type="range" id="slider" min="100" max="500" step="10" value="100">
  <div class="ticks"><span>100%</span><span>300%</span><span>500%</span></div>
  <button id="reset">Reset to 100%</button>
  <script src="popup.js"></script>
</body>
</html>
